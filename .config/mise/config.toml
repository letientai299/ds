[tools]
janet = "1.41.2"
shellcheck = "0.11.0"
shfmt = "3.13.1"
taplo = "0.10.0"

[env]
DS_SHELL_SOURCES = "ds src/bootstrap.sh src/pull.sh src/install.sh src/try.sh src/lib/*.sh src/bundle/*.sh src/runtime/*.sh src/scripts/*.sh src/dotfiles/*.sh tests/*.sh"
DS_ALPINE_IMAGE = "alpine@sha256:fd791d74b68913cbb027c6546007b3f0d3bc45125f797758156952bc2d6daf40"
DS_JANET_HEADER_SHA256 = "b82d7415df6826bdc3207624c56425bbfa5d783b88658330e58413f1f562f3e5"
DS_JANET_SHELL_SHA256 = "63c964253bbed159ecb1df890202278402f556260f56ee8014ce50bfbd6f2834"
DS_JANET_SOURCE_SHA256 = "2a0afcbe83823025c67899a867017095565f8a0a51851ab2507c9416ff3246b7"
DS_JANET_VERSION = "1.41.2"
DS_HELLO_WORLD_IMAGE = "hello-world@sha256:5dd0d3e6e255913fc30f90b9f2b1d359cc2cbdb48090cc4b65f1676e203243cc"
DS_MISE_VERSION = "2026.8.6"
DS_ROCKY_IMAGE = "rockylinux@sha256:d7be1c094cc5845ee815d4632fe377514ee6ebcf8efaed6892889657e5ddaaa6"
DS_UBUNTU_IMAGE = "ubuntu@sha256:561618e2c15bf2397621dd04f96926663a3b5616c189cf7e38db7e82f5c538ea"

[tasks.fmt]
description = "Format shell, C, and TOML sources"
run = [
  "shfmt -w $DS_SHELL_SOURCES",
  "if [ \"$(uname -s)\" = Darwin ]; then xcrun clang-format -i src/runtime/normalize-macho.c; fi",
  "taplo fmt .config/mise/config.toml src/catalog.toml src/mise/*.toml",
]

[tasks.preflight]
description = "Report delivery and Docker capabilities here, or on an SSH host"
run = "tests/ssh-preflight.sh"

[tasks.generate]
description = "Regenerate the resolved Janet catalog from canonical TOML"
run = "src/scripts/generate.sh --write"

# Split so the inner loop is seconds rather than minutes, and chained through
# depends rather than aggregated, because mise runs dependencies in parallel and
# a flat aggregator would pay the contract cost even when the lint fails.
[tasks."check:static"]
description = "Lint and format-check shell, C, TOML, and the generated catalog"
run = [
  "shellcheck -x $DS_SHELL_SOURCES",
  "shfmt -d $DS_SHELL_SOURCES",
  "for source in src/dotfiles/*.zsh src/dotfiles/omz/*.zsh src/dotfiles/trial/.zshrc tests/*.zsh; do zsh -n \"$source\" || exit; done",
  "if [ \"$(uname -s)\" = Darwin ]; then xcrun clang -std=c99 -Wall -Wextra -Werror -fsyntax-only src/runtime/normalize-macho.c; fi",
  "if [ \"$(uname -s)\" = Darwin ]; then xcrun clang-format --dry-run -Werror src/runtime/normalize-macho.c; fi",
  "taplo fmt --check .config/mise/config.toml src/catalog.toml src/mise/*.toml",
  "src/scripts/generate.sh --check",
]

[tasks."check:unit"]
depends = ["check:static"]
description = "Run Janet lints and unit tests"
run = [
  "JANET_PATH=$PWD/src janet -x strict src/scripts/generated/layers.janet",
  "JANET_PATH=$PWD/src janet -x strict src/scripts/generated/support.janet",
  "JANET_PATH=$PWD/src janet -x strict src/scripts/lib/layers.janet",
  "JANET_PATH=$PWD/src janet -x strict src/scripts/lib/activation.janet",
  "JANET_PATH=$PWD/src janet -x strict src/scripts/lib/help.janet",
  "JANET_PATH=$PWD/src janet -x strict src/scripts/lib/inventory.janet",
  "JANET_PATH=$PWD/src janet -x strict src/scripts/lib/json.janet",
  "JANET_PATH=$PWD/src janet -x strict src/scripts/lib/mutation.janet",
  "JANET_PATH=$PWD/src janet -x strict src/scripts/lib/filesystem.janet",
  "JANET_PATH=$PWD/src janet -x strict src/scripts/lib/docker.janet",
  "JANET_PATH=$PWD/src janet -x strict src/scripts/lib/mise.janet",
  "JANET_PATH=$PWD/src janet -x strict src/scripts/lib/managed.janet",
  "JANET_PATH=$PWD/src janet -x strict src/scripts/lib/platform.janet",
  "JANET_PATH=$PWD/src janet -x strict src/scripts/lib/planner.janet",
  "JANET_PATH=$PWD/src janet -x strict src/scripts/lib/process.janet",
  "JANET_PATH=$PWD/src janet -x strict src/scripts/lib/selection.janet",
  "JANET_PATH=$PWD/src janet -x strict src/scripts/lib/shell.janet",
  "DS_MISE=$(command -v mise) DS_ROOT=$PWD JANET_PATH=$PWD/src janet -x strict src/scripts/main.janet status core >/dev/null",
  "JANET_PATH=$PWD/src janet -x strict tests/harness.janet",
  "JANET_PATH=$PWD/src janet -x strict tests/layers.janet",
  "JANET_PATH=$PWD/src janet -x strict tests/mise.janet",
  "JANET_PATH=$PWD/src janet -x strict tests/docker.janet",
  "tests/managed.sh",
  "tests/rootful.sh",
  "sh tests/runtime-build.sh",
  "sh tests/shell-init.sh",
  "sh tests/shell.sh",
  "sh tests/aliases.sh",
  "sh tests/ux.sh",
  "sh tests/decisions.sh",
  "sh tests/checksum.sh",
  "sh tests/push.sh",
  "sh tests/try.sh",
  "sh tests/docker-shell.sh",
  "JANET_PATH=$PWD/src janet -x strict tests/platform.janet",
  "selection_home=$(mktemp -d ${TMPDIR:-/tmp}/ds-selection.XXXXXX); trap 'rm -rf \"$selection_home\"' EXIT; DS_TEST_HOME=$selection_home JANET_PATH=$PWD/src janet -x strict tests/selection.janet",
]

[tasks."check:contract"]
depends = ["check:unit"]
description = "Run the Gitless delivery contract end to end"
run = "DS_ROOT=$PWD DS_JANET=$(command -v janet) tests/contract.sh"

[tasks.check]
depends = ["check:contract"]
description = "Run static, unit, and contract checks"
run = "printf '%s\\n' 'check: ok'"

[tasks.try]
depends = ["runtime:build", "runtime:fetch-mise"]
description = "Apply a layer inside a throwaway container and open a shell"
run = "src/try.sh"

[tasks.release]
depends = ["runtime:build", "runtime:fetch-mise"]
description = "Build the four release archives that src/install.sh downloads"
run = "src/bundle/release.sh"

[tasks."runtime:fetch"]
description = "Fetch and verify the pinned Janet amalgamation"
run = "src/runtime/fetch.sh"

[tasks."runtime:fetch-mise"]
description = "Fetch and verify the pinned mise runtime matrix"
run = "src/runtime/fetch-mise.sh all"

[tasks."runtime:build"]
depends = ["runtime:fetch"]
description = "Build the four supported Janet runtimes"
run = "src/runtime/build.sh all"

[tasks."runtime:verify"]
depends = ["runtime:build", "runtime:fetch-mise"]
description = "Verify runtime architecture, linkage, and container execution"
run = "src/runtime/verify.sh all"

[tasks."runtime:reproducible"]
depends = ["runtime:fetch"]
description = "Build the runtime matrix twice and compare checksums"
run = "src/runtime/reproducible.sh"

[tasks."e2e:containers"]
depends = ["runtime:build", "runtime:fetch-mise"]
description = "Install and run Gitless snapshots in isolated Linux homes"
run = "tests/container.sh"

[tasks."e2e:controller"]
depends = ["runtime:build", "runtime:fetch-mise"]
description = "Probe and push an idempotent snapshot through the controller"
run = "tests/controller.sh"

[tasks."e2e:core"]
depends = ["runtime:build", "runtime:fetch-mise"]
description = "Apply core twice in Alpine and Ubuntu"
run = "tests/core.sh"

[tasks."e2e:remote"]
depends = ["runtime:build", "runtime:fetch-mise"]
description = "Apply remote and verify tools and isolated Tmux on Alpine and Ubuntu"
run = "tests/remote.sh"

[tasks."e2e:docker-readiness"]
description = "Verify a ready Docker engine, Buildx, Compose, pull, build, and run"
run = "tests/docker-readiness.sh"

[tasks."e2e:macos"]
depends = ["runtime:fetch-mise"]
description = "Verify macOS no-write previews and Homebrew package selection"
run = "tests/macos.sh"

[tasks."e2e:rocky"]
depends = ["runtime:build", "runtime:fetch-mise"]
description = "Apply core twice and verify tools on Rocky Linux"
run = "tests/rocky.sh"

[tasks."e2e:all"]
description = "Run every end-to-end test concurrently"
run = "mise run --continue-on-error --jobs 7 e2e:containers ::: e2e:controller ::: e2e:core ::: e2e:remote ::: e2e:docker-readiness ::: e2e:macos ::: e2e:rocky"

[tasks.bench]
depends = ["runtime:build", "runtime:fetch-mise"]
description = "Measure bundle size and local startup baselines"
run = "tests/performance.sh"

[tasks."bench:linux"]
depends = ["runtime:build", "runtime:fetch-mise"]
description = "Measure cold, no-op, cache, and disk baselines on Ubuntu"
run = "tests/performance-linux.sh"

[tasks.verify]
depends = [
  "check",
  "runtime:verify",
  "runtime:reproducible",
  "e2e:containers",
  "e2e:controller",
  "e2e:core",
  "e2e:remote",
  "e2e:docker-readiness",
  "e2e:macos",
  "e2e:rocky",
]
description = "Run the complete reproducible validation matrix"
run = "printf '%s\\n' 'verify: ok'"
