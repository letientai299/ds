[tools]
janet = "1.41.2"
shellcheck = "0.11.0"
shfmt = "3.13.1"
taplo = "0.10.0"

[env]
DF_ALPINE_IMAGE = "alpine@sha256:fd791d74b68913cbb027c6546007b3f0d3bc45125f797758156952bc2d6daf40"
DF_JANET_HEADER_SHA256 = "b82d7415df6826bdc3207624c56425bbfa5d783b88658330e58413f1f562f3e5"
DF_JANET_SHELL_SHA256 = "63c964253bbed159ecb1df890202278402f556260f56ee8014ce50bfbd6f2834"
DF_JANET_SOURCE_SHA256 = "2a0afcbe83823025c67899a867017095565f8a0a51851ab2507c9416ff3246b7"
DF_JANET_VERSION = "1.41.2"
DF_HELLO_WORLD_IMAGE = "hello-world@sha256:5dd0d3e6e255913fc30f90b9f2b1d359cc2cbdb48090cc4b65f1676e203243cc"
DF_MISE_VERSION = "2026.8.6"
DF_ROCKY_IMAGE = "rockylinux@sha256:d7be1c094cc5845ee815d4632fe377514ee6ebcf8efaed6892889657e5ddaaa6"
DF_UBUNTU_IMAGE = "ubuntu@sha256:561618e2c15bf2397621dd04f96926663a3b5616c189cf7e38db7e82f5c538ea"

[tasks.fmt]
description = "Format shell and Janet sources"
run = [
  "shfmt -w ds bootstrap.sh pull.sh bundle/*.sh runtime/*.sh tests/*.sh",
  "if [ \"$(uname -s)\" = Darwin ]; then xcrun clang-format -i runtime/normalize-macho.c; fi",
  "taplo fmt .miserc.toml catalog.toml mise*.toml",
]

[tasks.generate]
description = "Regenerate the resolved Janet catalog from canonical TOML"
run = "scripts/generate.sh --write"

[tasks.check]
description = "Run static, unit, and contract checks"
run = [
  "shellcheck ds bootstrap.sh pull.sh bundle/*.sh runtime/*.sh tests/*.sh",
  "if [ \"$(uname -s)\" = Darwin ]; then xcrun clang -std=c99 -Wall -Wextra -Werror -fsyntax-only runtime/normalize-macho.c; fi",
  "taplo fmt --check .miserc.toml catalog.toml mise*.toml",
  "scripts/generate.sh --check",
  "JANET_PATH=$PWD janet -x strict scripts/generated/layers.janet",
  "JANET_PATH=$PWD janet -x strict scripts/generated/support.janet",
  "JANET_PATH=$PWD janet -x strict scripts/lib/layers.janet",
  "JANET_PATH=$PWD janet -x strict scripts/lib/filesystem.janet",
  "JANET_PATH=$PWD janet -x strict scripts/lib/docker.janet",
  "JANET_PATH=$PWD janet -x strict scripts/lib/mise.janet",
  "JANET_PATH=$PWD janet -x strict scripts/lib/managed.janet",
  "JANET_PATH=$PWD janet -x strict scripts/lib/platform.janet",
  "JANET_PATH=$PWD janet -x strict scripts/lib/planner.janet",
  "JANET_PATH=$PWD janet -x strict scripts/lib/process.janet",
  "JANET_PATH=$PWD janet -x strict scripts/lib/selection.janet",
  "DF_MISE=$(command -v mise) DF_ROOT=$PWD JANET_PATH=$PWD janet -x strict scripts/main.janet status core >/dev/null",
  "JANET_PATH=$PWD janet -x strict tests/harness.janet",
  "JANET_PATH=$PWD janet -x strict tests/layers.janet",
  "JANET_PATH=$PWD janet -x strict tests/mise.janet",
  "JANET_PATH=$PWD janet -x strict tests/docker.janet",
  "tests/managed.sh",
  "tests/rootful.sh",
  "JANET_PATH=$PWD janet -x strict tests/platform.janet",
  "selection_home=$(mktemp -d ${TMPDIR:-/tmp}/df-selection.XXXXXX); trap 'rm -rf \"$selection_home\"' EXIT; DF_TEST_HOME=$selection_home JANET_PATH=$PWD janet -x strict tests/selection.janet",
  "DF_ROOT=$PWD DF_JANET=$(command -v janet) tests/contract.sh",
]

[tasks."runtime:fetch"]
description = "Fetch and verify the pinned Janet amalgamation"
run = "runtime/fetch.sh"

[tasks."runtime:fetch-mise"]
description = "Fetch and verify the pinned mise runtime matrix"
run = "runtime/fetch-mise.sh all"

[tasks."runtime:build"]
depends = ["runtime:fetch"]
description = "Build the four supported Janet runtimes"
run = "runtime/build.sh all"

[tasks."runtime:verify"]
depends = ["runtime:build", "runtime:fetch-mise"]
description = "Verify runtime architecture, linkage, and container execution"
run = "runtime/verify.sh all"

[tasks."runtime:reproducible"]
depends = ["runtime:fetch"]
description = "Build the runtime matrix twice and compare checksums"
run = "runtime/reproducible.sh"

[tasks."e2e:containers"]
depends = ["runtime:build", "runtime:fetch-mise"]
description = "Install and run Gitless snapshots in isolated Linux homes"
run = "tests/container.sh"

[tasks."e2e:controller"]
depends = ["runtime:build", "runtime:fetch-mise"]
description = "Probe and push an idempotent snapshot through the controller"
run = "tests/controller.sh"

[tasks."e2e:core"]
depends = ["runtime:build", "runtime:fetch-mise"]
description = "Apply core twice in Alpine and Ubuntu"
run = "tests/core.sh"

[tasks."e2e:remote"]
depends = ["runtime:build", "runtime:fetch-mise"]
description = "Apply remote and verify tools and isolated Tmux on Alpine and Ubuntu"
run = "tests/remote.sh"

[tasks."e2e:docker-readiness"]
description = "Verify a ready Docker engine, Buildx, Compose, pull, build, and run"
run = "tests/docker-readiness.sh"

[tasks."e2e:macos"]
depends = ["runtime:fetch-mise"]
description = "Verify macOS no-write previews and Homebrew package selection"
run = "tests/macos.sh"

[tasks."e2e:rocky"]
depends = ["runtime:build", "runtime:fetch-mise"]
description = "Apply core twice and verify tools on Rocky Linux"
run = "tests/rocky.sh"

[tasks."e2e:all"]
description = "Run every end-to-end test concurrently"
run = "mise run --continue-on-error --jobs 7 e2e:containers ::: e2e:controller ::: e2e:core ::: e2e:remote ::: e2e:docker-readiness ::: e2e:macos ::: e2e:rocky"

[tasks.bench]
depends = ["runtime:build", "runtime:fetch-mise"]
description = "Measure bundle size and local startup baselines"
run = "tests/performance.sh"

[tasks."bench:linux"]
depends = ["runtime:build", "runtime:fetch-mise"]
description = "Measure cold, no-op, cache, and disk baselines on Ubuntu"
run = "tests/performance-linux.sh"

[tasks.verify]
depends = [
  "check",
  "runtime:verify",
  "runtime:reproducible",
  "e2e:containers",
  "e2e:controller",
  "e2e:core",
  "e2e:remote",
  "e2e:docker-readiness",
  "e2e:macos",
  "e2e:rocky",
]
description = "Run the complete reproducible validation matrix"
run = "printf '%s\\n' 'verify: ok'"
