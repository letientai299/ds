[layers]
core = [
  "mise",
  "git",
  "curl",
  "zsh",
  "neovim",
  "fd",
  "fzf",
  "ripgrep",
  "tree-sitter",
  "zoxide",
  "jq",
  "xh",
]
remote = ["tmux", "docker", "yazi"]
extra = ["bat", "delta", "worktrunk", "gokill", "eza", "gdu", "ouch"]
ui = ["kitty"]
all = []
optional = []

[extends]
remote = ["core"]
all = ["*"]

[components.mise]
commands = ["mise"]
owner = "runtime"

[components.git]
commands = ["git"]
owner = "native"

[components.curl]
commands = ["curl"]
owner = "native"

[components.zsh]
commands = ["zsh"]
owner = "native"

[components.neovim]
commands = ["nvim"]
owner = "mise"

[components.fd]
commands = ["fd"]
owner = "mise"

[components.fzf]
commands = ["fzf"]
owner = "mise"

[components.ripgrep]
commands = ["rg"]
owner = "mise"

[components.tree-sitter]
commands = ["tree-sitter"]
owner = "mise"

[components.worktrunk]
commands = ["wt"]
owner = "mise"
tool = "http-worktrunk"

[components.jq]
commands = ["jq"]
owner = "mise"

[components.xh]
commands = ["xh"]
owner = "mise"

[components.gokill]
commands = ["gokill"]
owner = "mise"
tool = "http-gokill"

[components.eza]
commands = ["eza"]
owner = "mise"

[components.gdu]
commands = ["gdu"]
owner = "mise"

[components.ouch]
commands = ["ouch"]
owner = "mise"
tool = "http-ouch"

[components.tmux]
commands = ["tmux"]
owner = "native"

[components.docker]
commands = ["docker"]
owner = "native"

[components.yazi]
commands = ["yazi", "ya"]
owner = "mise"

[components.zoxide]
commands = ["zoxide"]
owner = "mise"

[components.bat]
commands = ["bat"]
owner = "mise"

[components.delta]
commands = ["delta"]
owner = "mise"
tool = "http-delta"

[components.kitty]
commands = ["kitty", "kitten"]
owner = "mise"
tool = "http-kitty"
