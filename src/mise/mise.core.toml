[tools]
fd = "latest"
fzf = "latest"
jq = "latest"
neovim = { version = "0.12.5", postinstall = 'sh "{{config_root}}/../scripts/neovim-postinstall.sh"', install_env = { DS_NVIM_SOURCE_SHA256 = "a810c95332317bd0017e1ca07e376a8472c79075cbed00fa3737d190a8a0a45a" } }
ripgrep = "latest"
tree-sitter = { version = "latest", postinstall = 'if [ -f /etc/alpine-release ]; then ln -sfn /usr/bin/tree-sitter "$MISE_TOOL_INSTALL_PATH/tree-sitter"; fi' }
xh = "latest"
zoxide = "latest"

[bootstrap.packages]
"apk:ca-certificates" = "latest"
"apk:build-base" = "latest"
"apk:cmake" = "latest"
"apk:coreutils" = "latest"
"apk:curl" = "latest"
"apk:git" = "latest"
"apk:gettext-tiny-dev" = "latest"
"apk:linux-headers" = "latest"
"apk:tree-sitter-cli" = "latest"
"apk:samurai" = "latest"
"apk:zsh" = "latest"
"apt:ca-certificates" = "latest"
"apt:curl" = "latest"
"apt:git" = "latest"
"apt:zsh" = "latest"
"brew:ca-certificates" = { os = "macos" }
"brew:git" = { os = "macos" }
"brew:zsh" = { os = "macos" }
"dnf:ca-certificates" = "latest"
"dnf:curl-minimal" = "latest"
"dnf:git" = "latest"
"dnf:zsh" = "latest"
