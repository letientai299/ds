[layers]
core = [
  "mise",
  "git",
  "curl",
  "zsh",
  "neovim",
  "fd",
  "fzf",
  "ripgrep",
  "worktrunk",
  "zoxide",
  "jq",
  "gokill",
  "xh",
]
remote = [
  "mise",
  "git",
  "curl",
  "zsh",
  "neovim",
  "fd",
  "fzf",
  "ripgrep",
  "worktrunk",
  "zoxide",
  "jq",
  "gokill",
  "xh",
  "tmux",
  "docker",
  "bat",
  "delta",
]
optional = []

[components.mise]
commands = ["mise"]
owner = "runtime"

[components.git]
commands = ["git"]
owner = "native"

[components.curl]
commands = ["curl"]
owner = "native"

[components.zsh]
commands = ["zsh"]
owner = "native"

[components.neovim]
commands = ["nvim"]
owner = "mise"

[components.fd]
commands = ["fd"]
owner = "mise"

[components.fzf]
commands = ["fzf"]
owner = "mise"

[components.ripgrep]
commands = ["rg"]
owner = "mise"

[components.worktrunk]
commands = ["wt"]
owner = "mise"
tool = "http-worktrunk"

[components.jq]
commands = ["jq"]
owner = "mise"

[components.xh]
commands = ["xh"]
owner = "mise"

[components.gokill]
commands = ["gokill"]
owner = "mise"
tool = "http-gokill"

[components.tmux]
commands = ["tmux"]
owner = "native"

[components.docker]
commands = ["docker"]
owner = "native"

[components.zoxide]
commands = ["zoxide"]
owner = "mise"

[components.bat]
commands = ["bat"]
owner = "mise"

[components.delta]
commands = ["delta"]
owner = "mise"
tool = "http-delta"
